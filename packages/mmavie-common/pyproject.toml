[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mmavie-common"
version = "0.1.0"
description = "Shared service kit and contracts for MMA Voice Intelligence Engine (MMA-VIE)"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "starlette==1.10.0",
  "uvicorn[standard]==0.34.0",
  "pydantic-settings==2.7.0",
  "httpx==0.28.1",
  "prometheus-client==0.21.1",
  "websockets>=13,<18",
]

[tool.setuptools.packages.find]
where = ["src"]
